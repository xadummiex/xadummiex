<!DOCTYPE html>
<html>
<head>
    <title>Erik's CV Viewer</title>
    <style>
        body { margin: 0; padding: 20px; background: #f5f5f5; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; }
        .nav { margin: 20px 0; }
        .btn { 
            display: inline-block; 
            margin: 10px; 
            padding: 12px 24px; 
            background: orange; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px;
            font-weight: bold;
        }
        iframe { 
            width: 100%; 
            height: 800px; 
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Erik's Resume</h1>
        <div class="nav">
            <a href="#en" class="btn">English CV</a>
            <a href="#ru" class="btn">Russian CV</a>
        </div>
        
        <div id="en">
            <h2>English Version</h2>
            <iframe src="Mursalimov_cv_en.pdf"></iframe>
        </div>
        
        <div id="ru" style="display:none;">
            <h2>Russian Version</h2>
            <iframe src="Mursalimov_cv_ru.pdf"></iframe>
        </div>
    </div>

    <script>
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('en').style.display = 'none';
                document.getElementById('ru').style.display = 'none';
                const target = this.getAttribute('href').substring(1);
                document.getElementById(target).style.display = 'block';
            });
        });
    </script>
</body>
</html>
